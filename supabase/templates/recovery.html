<!doctype html>
<html lang="en"><body style="margin:0;background:#F7F6F2;color:#151A20;font-family:Arial,sans-serif;padding:32px 20px">
  <main style="max-width:520px;margin:auto;background:#ffffff;border:1px solid #e3e3dc;border-radius:20px;padding:32px">
    <p style="font-size:20px;font-weight:bold;color:#147D72">EventraHQ</p>
    <h1 style="font-size:28px;line-height:1.2">Reset your password.</h1>
    <p style="font-size:16px;line-height:1.6">Use this link to verify your request. Then choose a new password in your account settings.</p>
    <p style="margin:28px 0"><a style="display:inline-block;border-radius:10px;background:#147D72;color:#ffffff;padding:14px 22px;text-decoration:none;font-weight:bold" href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery">Reset password</a></p>
    <p style="font-size:14px;line-height:1.6">If you didn't request a reset, ignore this email. Your password has not changed.</p>
  </main>
</body></html>

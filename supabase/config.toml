# Local workstation profile. Managed development setup: docs/SUPABASE_SETUP.md.
# Qualify the pinned CLI's actual Docker port bindings before use (see docs/database.md).
project_id = "eventrahq-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
auto_expose_new_tables = false

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324
# No smtp_port or pop3_port: no host publication of mail protocols is requested.

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
external_url = "http://127.0.0.1:3000/auth/v1"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.sms]
enable_signup = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

# The web handler exchanges token_hash server-side and sets HttpOnly session cookies.
[auth.email.template.confirmation]
subject = "Confirm your local EventraHQ account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your local EventraHQ password"
content_path = "./supabase/templates/recovery.html"

[analytics]
enabled = false

[edge_runtime]
enabled = false
